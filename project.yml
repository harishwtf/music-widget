name: MusicWidget
options:
  bundleIdPrefix: com.harish
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    GENERATE_INFOPLIST_FILE: NO
targets:
  MusicWidget:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
      - path: Vendor/mediaremote-adapter/mediaremote-adapter.pl
        buildPhase: resources
      - path: Vendor/mediaremote-adapter/LICENSE
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleName: MusicWidget
        CFBundleDisplayName: Music Widget
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSAppleEventsUsageDescription: "Music Widget needs this to control Spotify, Apple Music and the YouTube tab in your browser."
        NSHumanReadableCopyright: "Built by Harish"
    dependencies:
      - target: MusicWidgetExtension
        embed: true
      - framework: Vendor/mediaremote-adapter/MediaRemoteAdapter.framework
        embed: true
        link: false
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harish.musicwidget
        PRODUCT_NAME: MusicWidget
  MusicWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleName: MusicWidgetExtension
        CFBundleDisplayName: Music Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harish.musicwidget.widget
        PRODUCT_NAME: MusicWidgetExtension
