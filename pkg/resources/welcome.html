<h2>Music Widget</h2>
<p>A desktop widget with play, pause, skip and volume controls for <b>Spotify</b>, <b>Apple Music</b> and <b>YouTube</b> (in Chrome, Safari and other browsers).</p>
<p>This installs <b>MusicWidget.app</b> into your Applications folder. It runs quietly in the menu bar and starts at login; the widget needs it running.</p>
